<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#075b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Leitura FORMS</title>
<style>
:root{
  --green:#075b3a; --green2:#0b7a4b; --light:#eaf7f0; --bg:#f4f7f6;
  --text:#17332a; --muted:#6d7b76; --border:#dce6e1; --white:#fff;
  --shadow:0 6px 18px rgba(0,0,0,.07);
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
/* Cabeçalho desce abaixo da barra de status (hora, bateria) do iPhone */
header{background:linear-gradient(135deg,var(--green),#0a8150);color:white;
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 14px) 12px calc(env(safe-area-inset-left,0px) + 14px);
  position:sticky;top:0;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.headerline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:8px}.sun{font-size:22px}.brand{font-size:18px;font-weight:800;letter-spacing:.3px}
.subtitle{font-size:11px;opacity:.9;margin-top:1px}
.count{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:5px 9px;border-radius:10px;text-align:center;font-size:10px}
.count b{display:block;font-size:15px}
main{max-width:1050px;margin:auto;padding:12px 12px 8px}
.card{background:white;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
label{font-size:12px;font-weight:800;margin-bottom:5px;display:block}
/* 16px nos campos evita o zoom automático do iPhone ao tocar */
input,select{width:100%;height:44px;border:1px solid #cfdcd6;border-radius:10px;padding:0 10px;font-size:16px;background:#fff;color:var(--text);outline:none}
input[type=date]{display:block;min-width:0;-webkit-appearance:none;appearance:none;line-height:44px}
input:focus,select:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(11,122,75,.1)}
.req{color:#d92d20}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
button{border:0;border-radius:12px;min-height:42px;padding:0 10px;font-weight:800;font-size:14px;cursor:pointer}
button:disabled{opacity:.7;cursor:wait}
.primary{background:var(--green2);color:white}.secondary{background:#edf3f0;color:var(--green)}
.blue{background:#2475dc;color:white}.orange{background:#ed9700;color:white}.gray{background:#66727a;color:white}
.message{font-size:12px;margin-top:8px;min-height:16px;color:var(--green2);font-weight:700}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.toolbar input{min-width:0}

/* ===== Calendário ===== */
.calcard{padding:10px 12px}
.calhead{display:flex;align-items:center;gap:6px}
.calnav{width:36px;min-width:36px;min-height:36px;padding:0;border-radius:10px;background:#edf3f0;color:var(--green);font-size:14px}
.calmes{flex:1;min-width:0;min-height:36px;padding:0 6px;border-radius:10px;background:transparent;color:var(--text);
  font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.calmes .seta{font-size:11px;color:var(--muted);transition:transform .2s}
.calcard.aberto .calmes .seta{transform:rotate(180deg)}
.calcorpo{display:none;margin-top:8px}
.calcard.aberto .calcorpo{display:block}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.calwd{font-size:10px;font-weight:800;color:var(--muted);text-align:center;padding:0 0 2px}
.calday{position:relative;min-height:32px;height:32px;padding:0;border-radius:8px;background:#f7faf9;border:1.5px solid transparent;
  color:var(--text);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.calday.vazio{visibility:hidden;pointer-events:none}
.calday.tem{background:var(--light)}
.calday.hoje{border-color:var(--green2)}
.calday.sel{background:var(--green2);color:#fff;border-color:var(--green2)}
.calday .qtd{position:absolute;top:-4px;right:-3px;font-size:8.5px;font-weight:800;background:var(--green);color:#fff;
  border-radius:999px;padding:0 4px;line-height:14px;min-width:14px;text-align:center;z-index:1}
.calday.sel .qtd{background:#fff;color:var(--green);box-shadow:0 0 0 1px var(--green2)}
.calfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.calfoot span{font-size:11.5px;color:var(--muted);font-weight:700}
.chip{min-height:30px;font-size:12px;padding:0 10px;border-radius:999px;background:#edf3f0;color:var(--green)}
.printtitle{display:none}

.stage-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.stage-title h2{margin:0;font-size:16px}.badge{background:var(--light);color:var(--green);border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700}
.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:650px;background:white}
th{background:var(--green);color:white;text-align:left;padding:8px;font-size:11px}
td{padding:8px;border-top:1px solid #e7eeeb;font-size:12px}
tr:nth-child(even) td{background:#fafcfb}
.empty{text-align:center;padding:18px;color:var(--muted);font-size:13px}
.del{background:#feeceb;color:#b42318;min-height:30px;min-width:36px;padding:0 8px;font-size:14px;border:1px solid #f5c9c5}
tr td:first-child{position:relative}
.deleteHead,.deleteCell{display:table-cell;text-align:center}
.deleteHead{width:44px}.deleteCell{width:44px;padding:5px}
.del{position:static;transform:none;min-width:32px;width:32px;height:30px;padding:0;border-radius:8px;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--light);border-radius:14px;padding:10px 12px}.stat b{font-size:20px;display:block;color:var(--green)}.stat span{font-size:11px;color:var(--muted)}
footer{text-align:center;color:#83918c;font-size:11px;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 20px)}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.campoData{grid-column:1 / -1}}
@media(max-width:430px){
  .grid{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}.actions button:last-child{grid-column:1 / -1}.toolbar{grid-template-columns:1fr auto}
  .tablewrap{overflow:hidden}
  table{min-width:0;width:100%;table-layout:fixed}
  th,td{padding:7px 5px;font-size:10.5px;word-break:break-word}
  th:nth-child(1),td:nth-child(1){width:24%}
  th:nth-child(2),td:nth-child(2){width:28%}
  th:nth-child(3),td:nth-child(3){width:12%}
  th:nth-child(4),td:nth-child(4){width:14%}
  th:nth-child(5),td:nth-child(5){width:22%}
  .del{width:28px;min-width:28px;height:28px;font-size:14px}
  .calday{min-height:42px;font-size:13px}
}
@media print{
  header,.formcard,.calcard,.toolbar,.stagebar,.actions,.del,.deleteHead,.deleteCell,footer{display:none!important}
  .printtitle{display:block;font-size:16px;font-weight:800;margin:0 0 10px}
  body{background:white}.card{box-shadow:none;border:0;padding:0}
  main{max-width:none;padding:0}.tablewrap{overflow:visible}
  table{min-width:0;font-size:11px}
}

.stage-block{margin-top:14px;padding-top:10px;border-top:1px solid var(--border)}
.stage-block:first-child{margin-top:0;padding-top:0;border-top:0}
.stagefilter label{display:block;margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:700}
.stagefilter select{height:44px;width:100%;border:1px solid #cfdcd6;border-radius:10px;background:#edf7f2;color:var(--green);font-size:16px;font-weight:800;padding:0 12px}
.stagefilter select:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(11,122,75,.1)}
</style>

<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="manifest" href="./manifest.json">
<meta name="application-name" content="Leitura FORMS">
<meta name="apple-mobile-web-app-title" content="Leitura FORMS">
</head>
<body>
<header>
  <div class="headerline">
    <div class="logo"><div class="sun">📋</div><div><div class="brand">Leitura FORMS</div><div class="subtitle">Acompanhamento de Leituras</div></div></div>
    <div class="count"><b id="totalTop">0</b>no mês</div>
  </div>
</header>

<main>
  <section class="card formcard">
    <h2>➕ Lançar nova leitura</h2>
    <div class="grid">
      <div><label>Código do cliente <span class="req">*</span></label><input id="codigo" inputmode="numeric" placeholder="Digite o C"></div>
      <div><label>Número do medidor <span class="req">*</span></label><input id="medidor" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" placeholder="Digite o medidor"></div>
      <div><label>Leitura <span class="req">*</span></label><input id="leitura" inputmode="numeric" placeholder="Digite a leitura"></div>
      <div><label>Etapa <span class="req">*</span></label><select id="etapaFiltro" aria-label="Etapa do lançamento" onchange="renderStages()"></select></div>
      <div class="campoData"><label>Data da leitura <span class="req">*</span></label><input id="dataLanc" type="date" aria-label="Data da leitura"></div>
    </div>
    <div class="actions">
      <button class="primary" onclick="salvarLeitura()">💾 Salvar</button>
      <button class="blue" onclick="exportarCSV()">⬇️ Exportar</button>
      <button class="orange" onclick="window.print()">🖨️ Imprimir</button>
      <button class="primary" id="btnCompartilharApp" type="button" aria-label="Compartilhar aplicativo">↗️ Compartilhar</button>
      <button class="gray" id="btnAtualizarApp" type="button" aria-label="Atualizar aplicativo">🔄 Atualizar app</button>
    </div>
    <div id="msg" class="message"></div>
  </section>

  <section class="card calcard" id="calCard">
    <div class="calhead">
      <button class="calnav" type="button" onclick="mudarMes(-1)" aria-label="Mês anterior">◀</button>
      <button class="calmes" type="button" onclick="alternarCalendario()" aria-label="Mostrar ou esconder os dias">📅 <span id="calTitulo">—</span> <span class="seta">▼</span></button>
      <button class="calnav" type="button" onclick="mudarMes(1)" aria-label="Próximo mês">▶</button>
    </div>
    <div class="calcorpo">
      <div class="calgrid" id="calGrid"></div>
    </div>
    <div class="calfoot">
      <span id="calInfo"></span>
      <div style="display:flex;gap:6px">
        <button class="chip" type="button" id="btnMesInteiro" onclick="verMesInteiro()" style="display:none">Mês inteiro</button>
        <button class="chip" type="button" onclick="irHoje()">Hoje</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="stats">
      <div class="stat"><b id="total">0</b><span>Leituras no mês</span></div>
      <div class="stat"><b id="etapasUsadas">0/18</b><span>Etapas no mês</span></div>
      <div class="stat"><b id="hoje">0</b><span>Lançadas hoje</span></div>
    </div>
    <div class="toolbar">
      <input id="busca" placeholder="🔎 Pesquisar por C, medidor ou leitura..." oninput="renderStages()">
      <button class="secondary" onclick="limparBusca()">Limpar</button>
    </div>
  </section>

  <section class="card">
    <div class="printtitle" id="printTitle"></div>
    <div class="stage-title">
      <h2>📍 Leituras por etapa</h2>
      <span class="badge" id="etapasUsadasLabel">0/18 com lançamento</span>
    </div>
    <div id="stagesContainer"></div>
  </section>
</main>
<footer>Leitura FORMS • Acompanhamento de Leituras</footer>


<script>
const KEY='solar_acompanhamento_leituras_v1';
let registros=JSON.parse(localStorage.getItem(KEY)||'[]');
let etapaAtual=1;

const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SEMANA=['D','S','T','Q','Q','S','S'];
const _hj=new Date();
let anoVisto=_hj.getFullYear();
let mesVisto=_hj.getMonth();   // 0 = janeiro
let diaSel=null;               // 'AAAA-MM-DD' ou null (mês inteiro)

const etapaFiltro=document.getElementById('etapaFiltro');
const dataLanc=document.getElementById('dataLanc');

for(let i=1;i<=18;i++){
  const o=document.createElement('option');
  o.value=i;
  o.textContent='Etapa '+i;
  etapaFiltro.appendChild(o);
}
etapaFiltro.value='1';

function mudarEtapa(valor){
  etapaAtual=Number(valor)||1;
  etapaFiltro.value=String(etapaAtual);
}

function pad(n){return String(n).padStart(2,'0')}
// Data no fuso do aparelho (antes usava UTC e, depois das 21h, caía no dia seguinte)
function isoLocal(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hojeISO(){return isoLocal(new Date())}
function brData(iso){const p=String(iso).split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function horaAgora(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function prefixoMes(){return anoVisto+'-'+pad(mesVisto+1)}
function nomeMes(){return MESES[mesVisto]+' de '+anoVisto}
function nomePeriodo(){return diaSel?brData(diaSel):nomeMes()}

dataLanc.value=hojeISO();

function salvarLeitura(){
  const codigo=document.getElementById('codigo').value.trim();
  const medidor=document.getElementById('medidor').value.trim();
  const leitura=document.getElementById('leitura').value.trim();
  const etapa=Number(etapaFiltro.value)||1;
  const dia=dataLanc.value||hojeISO();
  const msg=document.getElementById('msg');

  if(!codigo||!medidor||!leitura){
    msg.textContent='⚠️ Preencha C, medidor e leitura.';
    return;
  }

  registros.push({
    id:Date.now()+Math.random(),
    codigo,medidor,leitura,etapa,
    data:brData(dia)+', '+horaAgora(),
    dia:dia
  });

  localStorage.setItem(KEY,JSON.stringify(registros));
  document.getElementById('codigo').value='';
  document.getElementById('medidor').value='';
  document.getElementById('leitura').value='';

  // Se lançou em outro mês, o calendário vai pra esse mês
  const [a,m]=dia.split('-').map(Number);
  if(a!==anoVisto||m-1!==mesVisto){anoVisto=a;mesVisto=m-1;diaSel=null}
  else if(diaSel&&diaSel!==dia){diaSel=null}

  msg.textContent='✅ Leitura salva na Etapa '+etapa+' em '+brData(dia)+'.';
  renderStages();
  setTimeout(()=>msg.textContent='',2500);
}

/* ===== Calendário ===== */
function mudarMes(delta){
  mesVisto+=delta;
  if(mesVisto<0){mesVisto=11;anoVisto--}
  if(mesVisto>11){mesVisto=0;anoVisto++}
  diaSel=null;
  renderStages();
}
function irHoje(){
  const d=new Date();
  anoVisto=d.getFullYear();mesVisto=d.getMonth();diaSel=null;
  renderStages();
}
function verMesInteiro(){diaSel=null;renderStages()}
const CAL_KEY='leitura_forms_calendario_aberto';
function alternarCalendario(){
  const c=document.getElementById('calCard');
  c.classList.toggle('aberto');
  try{localStorage.setItem(CAL_KEY,c.classList.contains('aberto')?'1':'0')}catch(_){}
}
try{if(localStorage.getItem(CAL_KEY)==='1') document.getElementById('calCard').classList.add('aberto')}catch(_){}
function tocarDia(iso){diaSel=(diaSel===iso)?null:iso;renderStages()}

function renderCalendario(){
  const etapa=Number(etapaFiltro.value)||1;
  const pref=prefixoMes();
  const hoje=hojeISO();
  const porDia={};
  registros.forEach(r=>{
    if(Number(r.etapa)===etapa&&String(r.dia||'').startsWith(pref)){
      porDia[r.dia]=(porDia[r.dia]||0)+1;
    }
  });

  const t=diaSel?brData(diaSel):nomeMes();
  document.getElementById('calTitulo').textContent=t.charAt(0).toUpperCase()+t.slice(1);

  const grid=document.getElementById('calGrid');
  let html=SEMANA.map(s=>`<div class="calwd">${s}</div>`).join('');
  const primeiro=new Date(anoVisto,mesVisto,1).getDay();
  const qtdDias=new Date(anoVisto,mesVisto+1,0).getDate();
  for(let i=0;i<primeiro;i++) html+='<div class="calday vazio"></div>';
  for(let d=1;d<=qtdDias;d++){
    const iso=pref+'-'+pad(d);
    const n=porDia[iso]||0;
    const cls=['calday'];
    if(n) cls.push('tem');
    if(iso===hoje) cls.push('hoje');
    if(iso===diaSel) cls.push('sel');
    html+=`<button type="button" class="${cls.join(' ')}" onclick="tocarDia('${iso}')" aria-label="Dia ${d}${n?', '+n+' leituras':''}">${d}${n?`<span class="qtd">${n}</span>`:''}</button>`;
  }
  grid.innerHTML=html;

  const totalEtapaMes=Object.values(porDia).reduce((a,b)=>a+b,0);
  document.getElementById('calInfo').textContent=`Etapa ${etapa}: ${totalEtapaMes} ${totalEtapaMes===1?'leitura':'leituras'} no mês`;
  document.getElementById('btnMesInteiro').style.display=diaSel?'':'none';
}

function registrosDoPeriodo(){
  return registros.filter(r=>diaSel?r.dia===diaSel:String(r.dia||'').startsWith(prefixoMes()));
}

function renderStages(){
  renderCalendario();
  const q=document.getElementById('busca').value.trim().toLowerCase();
  const etapaSelecionada=Number(document.getElementById('etapaFiltro').value)||1;
  const container=document.getElementById('stagesContainer');
  container.innerHTML='';
  document.getElementById('printTitle').textContent='Leitura FORMS • Etapa '+etapaSelecionada+' • '+nomePeriodo();

  const lista=registrosDoPeriodo().filter(r=>
    Number(r.etapa)===etapaSelecionada &&
    (!q || [r.codigo,r.medidor,r.leitura,r.data].some(x=>String(x).toLowerCase().includes(q)))
  );

  if(!lista.length){
    container.innerHTML=`<div class="empty">Nenhuma leitura na Etapa ${etapaSelecionada} em ${nomePeriodo()}.</div>`;
    atualizarResumo();
    return;
  }

  const box=document.createElement('div');
  box.className='stage-block';

  const title=document.createElement('div');
  title.className='stage-title';
  title.innerHTML=`<h2>Etapa ${etapaSelecionada} • <span style="text-transform:capitalize">${nomePeriodo()}</span></h2><span class="badge">${lista.length}${lista.length===1?' registro':' registros'}</span>`;
  box.appendChild(title);

  const wrap=document.createElement('div');
  wrap.className='tablewrap';

  const table=document.createElement('table');
  table.innerHTML='<thead><tr><th>Clientes</th><th>Número do medidor</th><th class="deleteHead">🗑️</th><th>Leitura</th><th>Data de lançamento</th></tr></thead>';

  const tbody=document.createElement('tbody');
  lista.slice().reverse().forEach(r=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><b>${esc(r.codigo)}</b></td><td>${esc(r.medidor)}</td><td class="deleteCell"><button class="del" title="Excluir leitura" aria-label="Excluir leitura" onclick="excluir('${r.id}')">🗑️</button></td><td><b>${esc(r.leitura)}</b></td><td>${esc(r.data)}</td>`;
    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  wrap.appendChild(table);
  box.appendChild(wrap);
  container.appendChild(box);

  atualizarResumo();
}

function atualizarResumo(){
  const doMes=registros.filter(r=>String(r.dia||'').startsWith(prefixoMes()));
  const etapasMes=new Set(doMes.map(r=>Number(r.etapa))).size;
  document.getElementById('total').textContent=doMes.length;
  const topo=document.getElementById('totalTop');
  if(topo) topo.textContent=doMes.length;
  document.getElementById('etapasUsadas').textContent=etapasMes+'/18';
  const label=document.getElementById('etapasUsadasLabel');
  if(label) label.textContent=etapasMes+'/18 com lançamento';
  document.getElementById('hoje').textContent=registros.filter(r=>r.dia===hojeISO()).length;
}
function excluir(id){
  if(!confirm('Excluir esta leitura?')) return;
  registros=registros.filter(r=>String(r.id)!==String(id));
  localStorage.setItem(KEY,JSON.stringify(registros)); renderStages();
}
function limparBusca(){document.getElementById('busca').value='';renderStages()}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

// Exporta só o período que está na tela (mês inteiro ou o dia tocado), todas as etapas
function exportarCSV(){
  const lista=registrosDoPeriodo();
  if(!lista.length){alert('Não há leituras em '+nomePeriodo()+' para exportar.');return}
  const linhas=[['C','Número do medidor','Leitura','Etapa','Data de lançamento']];
  lista.slice().sort((a,b)=>Number(a.etapa)-Number(b.etapa)||String(a.dia).localeCompare(String(b.dia)))
    .forEach(r=>linhas.push([r.codigo,r.medidor,r.leitura,r.etapa,r.data]));
  const csv='\ufeff'+linhas.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='leitura_forms_'+(diaSel||prefixoMes())+'.csv';
  a.click();URL.revokeObjectURL(a.href);
}
if(etapaFiltro) etapaFiltro.value='1';
renderStages();
</script>

<script id="shareAppScript">
(function(){
  // Link limpo do app (sem o parâmetro ?v= usado na atualização)
  function urlDoApp(){
    const u=new URL(window.location.href);
    u.hash='';
    u.searchParams.delete('v');
    return u.toString();
  }
  async function compartilharApp(){
    const url = urlDoApp();
    const dados = {
      title: 'Leitura FORMS',
      text: 'Acesse o aplicativo Leitura FORMS.',
      url: url
    };
    try{
      if(navigator.share){
        await navigator.share(dados);
      }else if(navigator.clipboard){
        await navigator.clipboard.writeText(url);
        alert('Link do aplicativo copiado.');
      }else{
        window.prompt('Copie o link do aplicativo:', url);
      }
    }catch(e){
      if(e && e.name === 'AbortError') return;
    }
  }

  // Busca a versão mais nova do app no servidor.
  // As leituras salvas NÃO são apagadas (ficam no localStorage).
  async function atualizarApp(){
    const b=document.getElementById('btnAtualizarApp');
    if(b){ b.disabled=true; b.textContent='⏳ Atualizando...'; }
    try{
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        for(const r of regs){
          try{ await r.update(); }catch(_){}
          try{ await r.unregister(); }catch(_){}
        }
      }
      if(window.caches){
        const nomes=await caches.keys();
        await Promise.all(nomes.map(n=>caches.delete(n)));
      }
    }catch(_){}
    const u=new URL(window.location.href);
    u.hash='';
    u.searchParams.set('v', Date.now());
    window.location.replace(u.toString());
  }

  document.addEventListener('DOMContentLoaded', function(){
    const b=document.getElementById('btnCompartilharApp');
    if(b) b.addEventListener('click', compartilharApp);
    const a=document.getElementById('btnAtualizarApp');
    if(a) a.addEventListener('click', atualizarApp);
  });
})();
</script>
